# nginx in front of fluid-config (TLS terminated here).
# fluid-config config.json: "trusted_proxies": ["127.0.0.1"]
# so allowed_ips, rate limits and logs see the real client address.

upstream fluid_config_api   { server 127.0.0.1:8090; keepalive 32; }
upstream fluid_config_admin { server 127.0.0.1:9090; keepalive 8; }

server {
    listen 443 ssl;
    http2 on;
    server_name config.example.com;
    ssl_certificate     /etc/letsencrypt/live/config.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/config.example.com/privkey.pem;

    client_max_body_size 2m;                # >= max_body_bytes

    # the APIs, at the root (or set api_base_path and use location /config/)
    location / {
        proxy_pass http://fluid_config_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the console under /config-admin/ (prefix stripped by the trailing slash)
    location /config-admin/ {
        allow 10.0.0.0/8;                   # office / VPN
        deny all;
        proxy_pass http://fluid_config_admin/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /config-admin;
        proxy_buffering off;                # live updates (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 32m;           # record imports
    }
}

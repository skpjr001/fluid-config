# Same routing as deploy/nginx/fluid-config.conf, on plain HTTP for testing.
events {}
http {
  server {
    listen 80;
    server_name config.test;
    location / { proxy_pass http://app:8090; include /etc/nginx/fluid-proxy.conf; }
  }
  server {
    listen 80;
    server_name example.test;
    location /config/ { proxy_pass http://app:8090; include /etc/nginx/fluid-proxy.conf; }  # no stripping
    location /config-admin/ {                                                              # stripping
      proxy_pass http://app:9090/;
      include /etc/nginx/fluid-proxy.conf;
      proxy_set_header X-Forwarded-Prefix /config-admin;
    }
  }
}
